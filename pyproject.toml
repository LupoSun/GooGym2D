[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "googym2d"
version = "0.2.0"
description = "Gymnasium-based 2D bridge construction environment for reinforcement and imitation learning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tao Sun" }]
keywords = [
    "reinforcement-learning",
    "imitation-learning",
    "gymnasium",
    "structural-design",
    "truss",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.urls]
Homepage = "https://luposun.github.io/GooGym2D/"
Repository = "https://github.com/LupoSun/GooGym2D"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["googym2d"]
